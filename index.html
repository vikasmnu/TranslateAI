<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TranslateAI</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <!-- logo and tagline -->
        </div>
      </header>
      <section>
        <h1 id="text-translate">Text to translate 👇</h1>
        <textarea></textarea>
        <section>
          <form>
            <fieldset>
              <legend>Language Selection</legend>

              <label>
                <input type="radio" name="language" value="french" />
                French
                <img src="assets/fr-flag.png" />
              </label>

              <label>
                <input type="radio" name="language" value="spanish" />
                Spanish
                <img src="assets/sp-flag.png" />
              </label>

              <label>
                <input type="radio" name="language" value="Japanese" />
                Japanese
                <img src="assets/jpn-flag.png" />
              </label>
            </fieldset>
          </form>
        </section>
        <button>Translate</button>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
