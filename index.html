<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PollyGlot</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="app-container">
      <header>
        <span>🦜</span>
        <h1>PollyGlot</h1>
        <p>Perfect Translation Every Time</p>
      </header>
      <div id="input-view">
        <label for="text-input">Text to translate 👇</label>
        <textarea name="" id="text-input" placeholder="How are you?"></textarea>

        <label>Select language 👇</label>
        <label
          ><input type="radio" name="language" value="fr" checked />
          French🇫🇷</label
        >
        <label
          ><input type="radio" name="language" value="es" /> Spanish 🇪🇸</label
        >
        <label
          ><input type="radio" name="language" value="ja" /> Japanese 🇯🇵</label
        >

        <button id="translate-btn">Translate</button>
      </div>
      <div id="output-view" class="hidden">
        <label id="original-display">Original text 👇</label>
        <label id="translation-display">Your translation 👇</label>
        <button id="start-over-btn">Start Over</button>
      </div>
    </div>
  </body>
</html>
