<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TranslateAI</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"/>
    <link rel="stylesheet" href="index.css"/>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/worldmap.png" />

        <div>
          <!-- logo and tagline -->
          <img src="assets/parrot.png" />
      </header>
      <section>
        <h1 id="text-translate">Text to translate 👇</h1>
        <textarea></textarea>
        <section>
          <form>
            <fieldset>
              <legend>Language Selection</legend>

              <label>
                <input type="radio" name="language" value="french" />
                French
                <img src="assets/fr-flag.png" />
              </label>

              <label>
                <input type="radio" name="language" value="spanish" />
                Spanish
                <img src="assets/sp-flag.png" />
              </label>

              <label>
                <input type="radio" name="language" value="Japanese" />
                Japanese
                <img src="assets/jpn-flag.png" />
              </label>
            </fieldset>
          </form>
        </section>
        <button>Translate</button>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
